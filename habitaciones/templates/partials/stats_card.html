<div class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-200 overflow-hidden">
    <div class="p-6 bg-{{ color }}-50">
        <div class="flex items-center gap-4">
            <div class="p-3 bg-{{ color }}-100 rounded-lg">
                <i class="bi {{ icon }} text-2xl text-{{ color }}-600"></i>
            </div>
            <div>
                <h3 class="text-sm font-medium text-gray-500">{{ title }}</h3>
                <p class="mt-1 text-3xl font-semibold text-{{ color }}-600">{{ value }}</p>
            </div>
        </div>
    </div>
</div>
