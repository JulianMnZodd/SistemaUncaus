{% extends '_base.html' %}
{% load static %}
{% block content %}

<!-- Cursor personalizado -->
<div class="cursor-follower" id="cursorFollower"></div>

<div class="container mx-auto px-3 py-8 max-w-4xl">
  <!-- Encabezado -->
  <div class="page-header">
    <h2 class="page-title">Crear Diagnóstico</h2>
    <p class="page-subtitle text-lg">
      Paciente: {{ paciente.nombre }} {{ paciente.apellido }}
    </p>
  </div>

  <!-- Formulario -->
  <form method="post" class="form-card animate__animated animate__fadeInUp">
    {% csrf_token %}

    <!-- Campo Detalles -->
    <div class="mb-6">
      <label for="{{ form.detalles.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
        {{ form.detalles.label }}
      </label>
      <textarea
        name="{{ form.detalles.name }}"
        id="{{ form.detalles.id_for_label }}"
        rows="4"
        class="form-input w-full"
        required
      ></textarea>
    </div>

    <!-- Campo Gravedad -->
    <div class="mb-6">
      <label for="{{ form.gravedad.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
        {{ form.gravedad.label }}
      </label>
      <input
        type="text"
        name="{{ form.gravedad.name }}"
        id="{{ form.gravedad.id_for_label }}"
        placeholder="Ej: Leve"
        class="form-input w-full"
        required
      >
    </div>

    <!-- Campo Tratamiento -->
    <div class="mb-6">
      <label for="{{ form.tratamiento.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
        {{ form.tratamiento.label }}
      </label>
      <textarea
        name="{{ form.tratamiento.name }}"
        id="{{ form.tratamiento.id_for_label }}"
        rows="4"
        class="form-input w-full"
        required
      ></textarea>
    </div>

    <!-- Campo Médico Derivado -->
    <div class="mb-8">
      <label for="{{ form.idmedico_derivado.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">
        {{ form.idmedico_derivado.label }}
      </label>
      <select
        name="{{ form.idmedico_derivado.name }}"
        id="{{ form.idmedico_derivado.id_for_label }}"
        class="form-input w-full"
      >
        <option value="">Seleccione un médico</option>
        {% for medico in form.idmedico_derivado.field.queryset %}
          <option value="{{ medico.persona.id }}">{{ medico.persona.first_name }} {{ medico.persona.last_name }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Botones -->
    <div class="flex items-center justify-end space-x-4">
      <button
        type="submit"
        class="btn btn-success"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Guardar
      </button>
      <a
        href="javascript:history.back()"
        class="btn btn-secondary"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
        Cancelar
      </a>
    </div>
  </form>
</div>

{% endblock content %}
