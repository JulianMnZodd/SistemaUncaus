{% if messages %}
  <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-4">
    {% for message in messages %}
      <div class="flex items-center w-full max-w-xs p-4 text-gray-500 bg-white rounded-lg shadow dark:text-gray-400 dark:bg-gray-800 border-l-4
        {% if message.tags == 'error' %}border-red-600{% elif message.tags == 'success' %}border-green-600{% elif message.tags == 'warning' %}border-yellow-500{% else %}border-blue-600{% endif %}">
        <div class="text-xl mr-3">
          {% if message.tags == 'error' %}
            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          {% elif message.tags == 'success' %}
            <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          {% elif message.tags == 'warning' %}
            <svg class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01"></path></svg>
          {% else %}
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01"></path></svg>
          {% endif %}
        </div>
        <div class="ml-2 text-sm font-normal">{{ message }}</div>
        <button type="button" onclick="this.parentElement.remove()" class="ml-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 inline-flex h-8 w-8">
          <span class="sr-only">Cerrar</span>
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
        </button>
      </div>
    {% endfor %}
  </div>
  <script>
    // Oculta automáticamente los mensajes después de 5 segundos
    setTimeout(() => {
      const container = document.getElementById('toast-container');
      if (container) container.remove();
    }, 5000);
  </script>
{% endif %}
