<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recuperar contraseña | BedWise</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
  <div class="w-full max-w-md bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-semibold mb-6">Recuperar contraseña</h1>
    <p class="mb-4 text-gray-600">Ingresá tu correo electrónico para recibir un enlace de restablecimiento.</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.email.label_tag }}
      {{ form.email }}

      {% if form.email.errors %}
      <p class="text-red-600 text-sm mt-1">{{ form.email.errors.0 }}</p>
      {% endif %}

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Enviar enlace
      </button>
    </form>

    <p class="mt-6 text-center text-sm">
      <a href="{% url 'login' %}" class="text-blue-600 hover:underline">Volver al inicio de sesión</a>
    </p>
  </div>
</body>
</html>
